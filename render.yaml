services:
  - type: web
    name: lead-gen-dashboard-backend
    runtime: python
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    branch: main
    autoDeploy: true
    healthCheckPath: /api/health
    envVars:
      - key: FASTAPI_ENV
        value: production
      - key: LOG_LEVEL
        value: info
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MAX_FILE_SIZE
        value: "10485760"
      - key: DATABASE_URL
        fromDatabase:
          name: lead-gen-db
          property: connectionString

databases:
  - name: lead-gen-db
    databaseName: lead_generation_db
    plan: free
    postgresMajorVersion: "15"
