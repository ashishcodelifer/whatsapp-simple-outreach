services:
  - type: web
    name: lead-gen-dashboard-backend
    runtime: python
    pythonVersion: 3.11
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port 8000"
    plan: free
    
    # Environment variables
    env:
      FASTAPI_ENV: production
      LOG_LEVEL: info
      ALLOWED_ORIGINS: ${FRONTEND_URL},${API_URL}
      MAX_FILE_SIZE: "10485760"
    
    # Secret environment variables
    envFile: .env
    
    # Auto-deploy from GitHub
    branch: main
    autoDeploy: true
    
    # Health check
    healthCheckPath: /api/health
    healthCheckInterval: 30
    healthCheckTimeout: 5
    healthCheckInitialDelay: 30

# Database
databases:
  - name: lead-gen-db
    databaseName: lead_generation_db
    user: postgres
    plan: free
    version: "15"
    
    # Environment variable for connection
    envVarName: DATABASE_URL
